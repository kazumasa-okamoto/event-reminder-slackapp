name: Remind today's KaiRA events

on:
  workflow_dispatch:
  schedule:
    # 08:00 JST every day.
    - cron: "0 23 * * *"

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Post reminder
        env:
          CONNPASS_API_KEY: ${{ secrets.CONNPASS_API_KEY }}
          SLACK_WEBHOOK_URL_EVENT_READING: ${{ secrets.SLACK_WEBHOOK_URL_EVENT_READING }}
          SLACK_WEBHOOK_URL_EVENT_TECH: ${{ secrets.SLACK_WEBHOOK_URL_EVENT_TECH }}
          CONNPASS_SUBDOMAIN: kaira-thesis-reading
          TZ: Asia/Tokyo
        run: uv run --locked kaira-event-reminder
